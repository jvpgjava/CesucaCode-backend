# Golden set da S.O.F.I.A. (consumido por `manage.py run_evals`).
#
# Todos os fatos vêm LITERALMENTE de apps/documents/seed_materials/*.md. O seed não
# tem material específico de ADS: só avaliação, manual e código disciplinar valem para
# os dois cursos; horário e planos de ensino são só de CC.
#
# Campos:
#   id               identificador único (slug)
#   question         mensagem enviada ao chat
#   persona          student_cc | student_ads | admin | coordinator_cc
#   history          (opcional) turnos prévios [{role: user|assistant, content}] para testar follow-up
#   expect           resposta | sem_info | recusa | clarificacao
#   must_include     fatos-chave curtos; comparação sem acento/caixa; "a|b" = alternativas
#   must_not_include (opcional) trechos que não podem aparecer
#   retrieval_expect trechos (literais do material) que devem aparecer em algum chunk recuperado
#   route_expect     (opcional) direta | composta | meta | recusa | pedagogica | clarificacao
#   rubric           (opcional) instrução extra para o juiz (ex.: dar dicas, não a solução)
#   tags             lista; a primeira é a área principal do caso
#
# Observação sobre a data do plano de ensino: o PDF é de 2025/1; as perguntas usam só
# o que o documento afirma (ementa, carga horária, conteúdo, avaliação, professor).

# ---------------------------------------------------------------- avaliação / notas
- id: aval-nf-formula
  question: Como é calculada a nota final nas disciplinas online?
  persona: student_cc
  expect: resposta
  must_include: ["A1", "A2", "soma|somando|somadas"]
  retrieval_expect: ["resulta da soma destas duas notas"]
  route_expect: direta
  tags: [avaliacao]

- id: aval-media-aprovacao
  question: Qual nota final eu preciso para ser aprovado numa disciplina?
  persona: student_cc
  expect: resposta
  must_include: ["6,0|6.0|seis"]
  retrieval_expect: ["igual ou superior a 6,0"]
  route_expect: direta
  tags: [avaliacao]

- id: aval-a1-prova
  question: Como é a A1? Quantas questões, quanto tempo de prova e quanto ela vale?
  persona: student_cc
  expect: resposta
  must_include: ["10 questões|10 questoes|dez questões", "3h30|3 horas e 30", "5,0|5.0|5 pontos|cinco"]
  retrieval_expect: ["3h30 de duração", "10 questões por disciplina"]
  route_expect: direta
  tags: [avaliacao]

- id: aval-a2-componentes
  question: O que compõe a nota A2?
  persona: student_cc
  expect: resposta
  must_include: ["Blackboard|ambiente virtual", "Sistematização Geral|ASG"]
  retrieval_expect: ["Atividade de Sistematização Geral"]
  route_expect: direta
  tags: [avaliacao]

- id: aval-af-direito
  question: Fiquei com nota final abaixo de 6. Tenho direito a fazer a Avaliação Final? Quanto ela vale e o que acontece com a nota?
  persona: student_cc
  expect: resposta
  must_include: ["1 ponto|um ponto", "0 a 5|0,0 a 5,0|cinco pontos|5 pontos", "substitu"]
  retrieval_expect: ["será garantida a Avaliação Final (AF)"]
  route_expect: direta
  tags: [avaliacao]

- id: aval-ap
  question: O que é a Atividade de Aprofundamento (AP) e quantos pontos ela vale?
  persona: student_cc
  expect: resposta
  must_include: ["dissertativa", "1,0|1.0|1 ponto"]
  retrieval_expect: ["Atividade dissertativa"]
  route_expect: direta
  tags: [avaliacao]

- id: aval-calculo-af
  question: Tirei 3,0 na A1 e 2,5 na A2. Fui aprovado?
  persona: student_cc
  expect: resposta
  must_include: ["5,5|5.5", "Avaliação Final|AF"]
  retrieval_expect: ["será garantida a Avaliação Final (AF)", "igual ou superior a 6,0"]
  route_expect: direta
  tags: [avaliacao]

- id: aval-ads-media
  question: No meu curso de ADS, qual a média para passar nas disciplinas online?
  persona: student_ads
  expect: resposta
  must_include: ["6,0|6.0|seis"]
  retrieval_expect: ["igual ou superior a 6,0"]
  route_expect: direta
  tags: [avaliacao, ads]

